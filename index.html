<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Set a new Calm Realm account password after using a password recovery link."
    />
    <title>Reset Password | Calm Realm</title>
  </head>
  <body>
    <main id="app" class="page-shell" aria-live="polite">
      <section class="reset-panel" aria-labelledby="reset-title">
        <div class="brand" aria-label="Calm Realm">
          <span class="brand-mark" aria-hidden="true">C</span>
          <span>Calm Realm</span>
        </div>

        <div class="mailbox" aria-hidden="true">
          <svg viewBox="0 0 180 110" role="img">
            <path class="mailbox-body" d="M66 31h56c18 0 33 15 33 33v28H66z" />
            <path class="mailbox-lid" d="M66 31c19 0 35 15 35 33v28H45V52c0-12 9-21 21-21z" />
            <path class="mailbox-flag" d="M48 61H22c-7 0-12-5-12-12s5-12 12-12h28" />
            <path class="mailbox-post" d="M117 92v17M147 92v17" />
            <path class="mailbox-mouth" d="M45 76c-18 1-31 5-36 11 16 4 31 1 45-8z" />
            <path class="envelope" d="M30 44h57v38H30z" />
            <path class="envelope-line" d="M31 45l28 23 28-23M31 82l20-20M87 82L67 62" />
          </svg>
        </div>

        <h1 id="reset-title">Reset password</h1>

        <div id="status" class="status" role="status" hidden></div>

        <form id="reset-form" class="reset-form" novalidate>
          <div class="field-group">
            <label for="new-password">New password</label>
            <div class="password-field">
              <input
                id="new-password"
                name="newPassword"
                type="password"
                minlength="6"
                autocomplete="new-password"
                required
              />
              <button
                class="icon-button"
                type="button"
                aria-label="Show new password"
                data-toggle-password="new-password"
              ></button>
            </div>
            <div class="password-meter" aria-hidden="true">
              <span></span><span></span><span></span><span></span>
            </div>
            <p class="field-error" id="new-password-error"></p>
          </div>

          <div class="field-group">
            <label for="confirm-password">Confirm new password</label>
            <div class="password-field">
              <input
                id="confirm-password"
                name="confirmPassword"
                type="password"
                minlength="6"
                autocomplete="new-password"
                required
              />
              <button
                class="icon-button"
                type="button"
                aria-label="Show confirm password"
                data-toggle-password="confirm-password"
              ></button>
            </div>
            <p class="field-error" id="confirm-password-error"></p>
          </div>

          <button id="submit-button" class="submit-button" type="submit">
            Update password
          </button>
        </form>
      </section>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
