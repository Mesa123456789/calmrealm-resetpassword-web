<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Set a new Calm Realm account password after using a password recovery link."
    />
    <title>Reset Password | Calm Realm</title>
  </head>
  <body>
    <main id="app" class="page-shell" aria-live="polite">
      <div class="reset-container">
        <!-- Title image – now inside the card -->
        <img src="/UX/group_1507.png" alt="Reset Password" class="title-image" />

        <div id="status" class="status" role="status" hidden></div>

        <form id="reset-form" class="reset-form" autocomplete="off" novalidate>
          <!-- Dummy fields to trick browser autofill -->
          <input type="text" style="display:none" aria-hidden="true" autocomplete="username">
          <input type="password" style="display:none" aria-hidden="true" autocomplete="current-password">

          <!-- New Password field -->
          <div class="field-wrapper">
            <label for="new-password" class="sr-only">New password</label>
            <div class="password-field">
              <div class="field-icon" aria-hidden="true">
                <img src="/UX/Exclude.png" alt="" width="22" height="22" />
              </div>
              <span class="field-label">New password</span>
              <div class="field-divider"></div>
              <input
                id="new-password"
                name="newPassword"
                type="password"
                minlength="6"
                autocomplete="new-password"
                placeholder="Enter new password"
                required
              />
              <button
                class="icon-button"
                type="button"
                aria-label="Show new password"
                data-toggle-password="new-password"
              ></button>
            </div>
            <p class="field-error" id="new-password-error"></p>
          </div>

          <!-- Confirm Password field -->
          <div class="field-wrapper">
            <label for="confirm-password" class="sr-only">Confirm new password</label>
            <div class="password-field">
              <div class="field-icon" aria-hidden="true">
                <img src="/UX/Exclude-1.png" alt="" width="22" height="22" />
              </div>
              <span class="field-label">Confirm password</span>
              <div class="field-divider"></div>
              <input
                id="confirm-password"
                name="confirmPassword"
                type="password"
                minlength="6"
                autocomplete="new-password"
                placeholder="Confirm password"
                required
              />
              <button
                class="icon-button"
                type="button"
                aria-label="Show confirm password"
                data-toggle-password="confirm-password"
              ></button>
            </div>
            <p class="field-error" id="confirm-password-error"></p>
          </div>

          <button id="submit-button" class="submit-button" type="submit">
            <span class="sr-only">Update password</span>
          </button>
        </form>
      </div>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
